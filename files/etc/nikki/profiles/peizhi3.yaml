    # 社交语音平台
    "*.discord.com": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    "*.discord.gg": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    # 常用开源CDN站点
    "*.jsdelivr.net": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
