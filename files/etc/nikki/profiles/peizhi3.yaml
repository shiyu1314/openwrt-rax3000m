# ==============================
#  Nikki 最终自用完整配置
# 开启仅核心模式在160行dns段中开启
# 出现网站不能访问未被代理请在360行rules加上该网址
# 出现网站跳转反诈宣传禁止访问/dns污染请在218行加网址
# 模式：策略路由(仿OpenClash) + 开启Fake-IP + IPv6全开
# 规则外流量全部直连，游戏/本地软件不受影响
# ==============================

# 混合代理端口 HTTP/SOCKS5 共用端口
mixed-port: 7890
# 允许局域网其他设备使用代理
allow-lan: true
# 监听本机所有网卡IP
bind-address: 0.0.0.0
# 运行模式：按规则分流
mode: rule
# 日志级别 error只输出错误，干净不刷屏
log-level: error
# 开启IPv6支持
ipv6: true
# 开启UDP转发(游戏/语音/流媒体必备)
udp: true
# 域名匹配严格模式
find-process-mode: off
# TCP长连接保活间隔
keep-alive: true
keep-alive-interval: 30

# 开启规则内存缓存，加快分流速度，减少重复联网
rule-cache: true

# 规则订阅走代理拉取，不直连，确保规则正常更新
profile:
  rule-providers-direct: false        # 保留，兼容OpenClash


# 关闭TUN虚拟网卡(不用全局劫持，避免游戏乱跑代理)
tun:
  enable: false

# 网页控制后台地址+密码
# 192.168.1.2:9090
external-controller: 0.0.0.0:9090
secret: "VZwfEX69"

