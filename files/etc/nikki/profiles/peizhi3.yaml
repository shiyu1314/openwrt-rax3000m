# ==============================
# 最终分流执行顺序规则
# ==============================================
# 【rules路由强制白名单】
# 作用：强制该域名全程直连，不走任何代理
# 和上面DNS白名单搭配使用，完美兼容Fake-IP
# ==============================================
rules:
 # 白名单网站强制直连【手动白名单网站】不想网站走代理/强制走代理加这里
  - IP-CIDR,91.108.0.0/16,PROXY,no-resolve    # telegram强制代理
  - IP-CIDR,149.154.0.0/16,PROXY,no-resolve  # telegram强制代理
  # Telegram网页域名强制不走本地解析直扔代理
  - DOMAIN-SUFFIX,telegram.org,PROXY,no-resolve
  - DOMAIN-SUFFIX,telegram.me,PROXY,no-resolve
  - DOMAIN-SUFFIX,t.me,PROXY,no-resolve
  # GitHub全系强制走代理杜绝间歇性打不开
  - DOMAIN-SUFFIX,github.com,PROXY,no-resolve
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY,no-resolve
  - DOMAIN-SUFFIX,github.io,PROXY,no-resolve
  # Google全系强制代理
  - DOMAIN-SUFFIX,google.com,PROXY,no-resolve
  - DOMAIN-SUFFIX,gstatic.com,PROXY,no-resolve
  # 推特X平台
  - DOMAIN-SUFFIX,twitter.com,PROXY,no-resolve
  - DOMAIN-SUFFIX,x.com,PROXY,no-resolve
# ==============================================
 # 白名单网站强制直连【手动白名单网站】不想网站走代理/强制走代理加这里
# 自用
  - DOMAIN-SUFFIX,ipin.io,DIRECT        # ip网站直连
  - DOMAIN,dc.sigmob.cn,DIRECT         # 单独允许一个广告 看广告领取会员用的
# ==============================================
  - RULE-SET,private,DIRECT              # 内网地址直连
  - RULE-SET,lancidr,DIRECT              # 局域网IP直连
  - DOMAIN-SUFFIX,lan,DIRECT        # 系统网络禁止代理
  - DOMAIN-SUFFIX,local,DIRECT      # 系统网络禁止代理
  - RULE-SET,reject,REJECT               # 拦截所有广告域名
# ==============================================
  - RULE-SET,proxy,PROXY                 # 国外网站走代理
  - RULE-SET,direct,DOMESTIC             # 国内网站走国内组
# ==============================================
# IP精准分流
  - GEOIP,CN,DOMESTIC                      # 【最高优先级2】只要是中国大陆IP → 国内切换组
  - GEOIP,!CN,PROXY                     # 【最高优先级3】剩下所有（境外IP）→ 全部强制走代理
routing:
  complete-fallback: true       # 强制遍历完所有规则条目，走完 IP 规则，最后再兜底
  default-action: direct        # 无匹配规则流量默认优先本地直连
  default-proxy: PROXY          # 直连访问失败自动切换至外网代理组
