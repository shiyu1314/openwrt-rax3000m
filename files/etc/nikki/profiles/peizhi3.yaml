# ==============================
# 分流策略组
# ==============================
proxy-groups:
  # 自动选延迟最低节点
  - name: 不限量合集
    type: url-test                                                  # 测速
    url: http://www.gstatic.com/generate_204     # 测速目标地址
    interval: 300                                                  # 测速间隔秒
    timeout: 5000                                               # 单次测速超时5秒（和max-delay配合）
    max-delay: 3000                                          # 超过2秒直接淘汰，快节点优先、慢节点不堆
    tolerance: 200                                             # 优选节点不切换最低延迟
    lazy: true                                                    # 无流量时不测速
    exclude-filter: "(到期|过期|试用|测试|体验)"                     # 不使用节点词汇    
    use:
      - 不限量机场
      - 不限量机场2
      - 不限量机场3


  # 故障备用节点
  - name: 限量兜底
    type: url-test                                                    # 测速
    url: http://www.gstatic.com/generate_204       # 测速目标地址
    interval: 300                                                    # 测速间隔秒
    timeout: 5000                                                 # 单次测速超时5秒（和max-delay配合）
    max-delay: 3000                                            # 超过2秒直接淘汰，快节点优先、慢节点不堆
    tolerance: 200                                               # 优选节点不切换最低延迟
    lazy: true                                                      # 无流量时不测速
    exclude-filter: "(到期|过期|试用|测试|体验)"                     # 不使用节点词汇    
    use:
      - 限量机场


  # 外网专用分组：故障自动切换备用
  - name: PROXY
    type: fallback
    proxies:
      - 不限量合集
      - 限量兜底
    interval: 180                                        # 检测连通间隔秒
    idle-timeout: 20                                  # 超时条件秒
    client-fingerprint: chrome                   # 模拟浏览器请求指纹，降低风控

  # 国内站点分组：手动选择直连/代理
  - name: DOMESTIC
    type: select
    proxies:
      - DIRECT      # 需要时手动切直连
      - PROXY      #需要时手动切代理
      - REJECT     #需要时手动切禁止
   
# ==============================
# DNS 域名解析配置 【核心】
# enhanced-mode: fake-ip 开启防劫持、广告拦截、快速分流
# ==============================
dns:
  enable: true
# ==============================
# 插件仅核心运行模式
# listen端口地址改为0.0.0.0:5353即可
# 非仅核心模式改回53
# 仅核心模式会导致dns分配失效 可能出现外网dns污染 可能出现部分网页提示该网站禁止访问
# 解决方案 在下面dns解析白名单加上不能访问的网站 rules白名单加上网站
# 日常建议不开仅核心
# ==============================
  listen: 0.0.0.0:53
  ipv6: true
  prefer-ipv6: true   #优先解析ipv6
# ==============================
# 网站解析方法 
# 开启fakeip模式取消注释即可  慢但准确
# 开启Mixed模式启用注释即可  快但可能漏
# 当前为Mixed模式
# enhanced-mode: fake-ip       # 开启Fake-IP 防DNS劫持+拦截广告
# fake-ip-range: 198.18.0.1/16 # 虚拟IP网段，固定不用改
# ==============================
# dns缓存 
  cache-size: 2000        # 最多存2000条域名解析记录
  cache-expire: 1800       # 缓存有效期 30分钟（单位：秒）
  cache-algorithm: arc     # 最优缓存淘汰算法（自动清老记录，推荐）
  dns-preload: true         # 域名预解析缓存
# ==============================
  # 调用你拉取的 dns-filter 规则（Fake-IP 白名单生效）
  fake-ip-filter: []

  # 开启/关闭Geosite启动全量预加载（解决重启CPU/内存爆满）
  # 优点：重启不卡、不爆内存、低负载运行
  # 缺点：首次访问国内域名极轻微延迟，二次访问恢复极速
  # true为开机一次性把所有 geosite 域名库全加载进内存
  geosite-preload: true

  # 默认国内DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 日常解析使用国内DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国外域名备用DNS
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - 8.8.8.8          # 备用纯IP DNS，更稳定
    - 1.1.1.1
  # 国内IP强制走国内DNS
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/12
    check: true  #解析失败自动切境外DNS，解决国内被墙/污染域名

  # ==============================================
  # 【Fake-IP-DNS解析白名单】
  # 作用：域名不走虚拟假IP，强制真实DNS解析
  # 解决网站跳转反诈网站 跳转被多人举报页面问题
  # 需要与380行rules白名单配合使用
  # 解决开C后网站打不开、解析失败问题
  # 新增打不开的域名直接在这里添加
  # ==============================================
  nameserver-policy:
    # 所有大陆域名强制国内纯净DNS，防劫持防污染
    "geosite:cn": [223.5.5.5, 119.29.29.29]
    # 规则订阅域名强制境外DNS解析（解决拉取规则失败）
    "raw.gitmirror.com": [8.8.8.8]
    "raw.githubusercontent.com": [8.8.8.8]
    "cdn.jsdelivr.net": [1.1.1.1]
    "nodesfree.github.io": [1.1.1.1]
   # Telegram全系防污染
    "*.telegram.org": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    "*.telegram.me": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    "*.t.me": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    # GitHub全系解决时好时坏DNS污染
    "*.github.com": ["https://dns.google/dns-query", "8.8.8.8"]
    "*.githubusercontent.com": ["https://dns.google/dns-query", "8.8.8.8"]
    "*.github.io": ["https://dns.google/dns-query", "8.8.8.8"]
    "gist.githubusercontent.com": ["https://dns.google/dns-query", "8.8.8.8"]
    # Google全家防污染
    "*.google.com": ["https://dns.google/dns-query", "8.8.8.8"]
    "*.googleapis.com": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    "*.gstatic.com": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
    # 推特X平台
    "*.x.com": ["https://cloudflare-dns.com/dns-query", "1.1.1.1"]
