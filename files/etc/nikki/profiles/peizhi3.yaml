# ==============================
# 远程规则订阅库
# GitHub 官方原生地址
# 统一 delay-check: 60 秒 → 开机先缓存/节点/测速，再拉规则
# 全部 lazy: true 延迟懒加载，避免启动卡顿
# ==============================
rule-providers:
  # 广告黑名单规则：屏蔽广告域名
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400          # 24小时更新一次
    proxy: PROXY              # 规则下载走代理分组
    proxy-respect-rules: true # 下载请求遵循全局分流
    lazy: true                # 启动不立即拉取，延迟加载
    delay-check: 300           # 开机300秒后再拉取此规则
    dns-respect-rules: true   # 规则解析遵守分流规则

  # 国外网站规则：匹配境外域名走代理
  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400          # 24小时更新一次
    proxy: PROXY              # 规则下载走代理分组
    proxy-respect-rules: true # 下载请求遵循全局分流
    lazy: true                # 启动不立即拉取，延迟加载
    delay-check: 120           # 开机60秒后再拉取此规则
    dns-respect-rules: true   # 规则解析遵守分流规则

  # 国内网站规则：匹配中国大陆域名直连
  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400          # 24小时更新一次
